name: Update salmon dashboard data

on:
  schedule:
    # Wednesdays 08:30 UTC = 09:30/10:30 Oslo. SSB publishes the weekly salmon export
    # figures every Wednesday at 08:00 Oslo time; lice reports for the previous week
    # are complete after Tuesday.
    - cron: "30 8 * * 3"
  workflow_dispatch:
    inputs:
      debug:
        description: "Verbose diagnostics in the log"
        type: boolean
        default: false
      keep_raw:
        description: "Also commit raw downloaded files under salmon-dashboard/data/raw (for parser work)"
        type: boolean
        default: false

concurrency:
  group: salmon-dashboard-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: salmon-dashboard/requirements.txt

      - name: Install dependencies
        run: pip install -r salmon-dashboard/requirements.txt

      - name: Fetch data from Norwegian government sources
        env:
          BARENTSWATCH_CLIENT_ID: ${{ secrets.BARENTSWATCH_CLIENT_ID }}
          BARENTSWATCH_CLIENT_SECRET: ${{ secrets.BARENTSWATCH_CLIENT_SECRET }}
          DEBUG: ${{ inputs.debug == true && '1' || '' }}
          KEEP_RAW: ${{ inputs.keep_raw == true && '1' || '' }}
        run: python salmon-dashboard/scripts/fetch_data.py

      - name: Commit and push refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A salmon-dashboard/data
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "data: refresh salmon dashboard ($(date -u +%Y-%m-%d))"
          for i in 1 2 3; do
            git pull --rebase origin "${{ github.ref_name }}" && git push origin HEAD:"${{ github.ref_name }}" && break
            echo "push attempt $i failed, retrying"; sleep 5
          done

      - name: Fail the run if a critical source failed
        run: |
          python - <<'PY'
          import json, sys
          s = json.load(open("salmon-dashboard/data/status.json"))
          print(json.dumps(s, indent=1))
          if s["critical_failed"]:
              print("Critical source(s) failed:", s["critical_failed"]); sys.exit(1)
          PY
